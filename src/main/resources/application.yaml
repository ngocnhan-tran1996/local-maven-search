app:
  jar:
    dowload-dir: target/jar/downloads/

spring:
  application:
    name: maven-search-application

logging:
  level:
    io.github.ngocnhantran1996.maven: debug

server:
  compression:
    enabled: true
    min-response-size: 2048
    mime-types:
      - text/html
      - text/xml
      - text/plain
      - text/css
      - text/javascript
      - application/javascript
      - application/json
      - application/xml